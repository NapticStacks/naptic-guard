# Publishes naptic-guard to PyPI on a version tag.
#
# Authentication is PyPI Trusted Publishing (OIDC). There is no API token and no
# repository secret: PyPI verifies GitHub's signed identity claim for this exact
# repo + workflow filename + environment. Changing the filename or the
# environment name breaks the trust relationship and the publish will be
# rejected, so treat both as load-bearing.
#
# PyPI side (one-time, already configured):
#   project naptic-guard | owner NapticStacks | repo naptic-guard
#   workflow release.yml | environment pypi
#
# All `uses:` are pinned to immutable commit SHAs, matching the convention in
# NapticStacks/.github reusable-security.yml. Bump only via a reviewed PR.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Run tests before publishing
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mandatory for Trusted Publishing. Job level, not workflow level.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
